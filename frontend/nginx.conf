# nginx in front of the built Vite bundle.
#
# Installed as /etc/nginx/conf.d/default.conf, replacing the image's default, so
# only a server block belongs here — the surrounding http {} comes from the base
# image's nginx.conf.
#
# Two jobs:
#
#   1. Serve the SPA, with every unknown path falling back to index.html so a deep
#      link reaches React Router instead of a 404.
#   2. Proxy the API paths to the backend container, which is what makes
#      VITE_API_BASE_URL empty and the bundle free of any developer's localhost.
#      The browser only ever talks to this origin, so there is no CORS preflight
#      and no second hostname compiled into the JavaScript.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # ---------------------------------------------------------------------
    # API Routes
    # ---------------------------------------------------------------------
    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location /health {
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Paths claimed by both API endpoints and the SPA routes
    location ~ ^/(upload|upload-product|dashboard|preview|results|insights|inventory|analyze|product-analysis) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # ---------------------------------------------------------------------
    # Static assets and the SPA fallback
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
